<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="XED Brands — One House. Many Brands.">
  <meta name="theme-color" content="#080808">
  <title>XED Brands | One House. Many Brands.</title>
  <style>
    :root { --bg:#080808; --gold:#e7b84b; --gold-soft:#f8e7b0; --red:#e31824; --muted:#bdb8b1; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:#f7f3eb; background:var(--bg); font-family:Arial, Helvetica, sans-serif; }
    a { color:inherit; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:24px clamp(22px,6vw,88px); border-bottom:1px solid rgba(231,184,75,.5); }
    .wordmark { text-decoration:none; font-weight:800; letter-spacing:.2em; font-size:clamp(16px,2vw,24px); color:var(--gold); white-space:nowrap; }
    .wordmark .x { color:var(--red); }
    nav { display:flex; gap:clamp(16px,3vw,42px); }
    nav a { font-size:12px; letter-spacing:.18em; text-decoration:none; color:var(--gold-soft); }
    nav a:hover, .contact-link:hover { color:white; }
    .hero { min-height:calc(100svh - 148px); display:flex; align-items:center; position:relative; overflow:hidden; padding:80px clamp(22px,14vw,220px); }
    .hero:before { content:""; position:absolute; width:min(76vw,850px); aspect-ratio:1; border:1px solid rgba(231,184,75,.75); border-radius:50%; right:-9%; top:50%; transform:translateY(-50%); box-shadow:0 0 28px rgba(231,184,75,.08), inset 0 0 30px rgba(231,184,75,.035); }
    .hero:after { content:""; position:absolute; width:90vw; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); right:-10%; bottom:10%; transform:rotate(-22deg); transform-origin:right; opacity:.75; }
    .content { position:relative; z-index:1; max-width:700px; }
    .eyebrow { color:var(--gold); text-transform:uppercase; letter-spacing:.35em; font-size:12px; margin:0 0 26px; }
    h1 { margin:0; line-height:.92; letter-spacing:.03em; font-size:clamp(72px,13vw,160px); font-weight:900; }
    h1 .x { color:var(--red); }
    h1 .ed { background:linear-gradient(120deg,#fff1b8 0%,#d9a83d 48%,#fff0b4 72%,#ad7419 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .brands { margin-top:12px; color:var(--gold); letter-spacing:.42em; font-size:clamp(24px,4vw,48px); font-weight:700; }
    .tagline { margin:30px 0 14px; font-size:clamp(23px,3vw,36px); color:var(--gold-soft); font-weight:400; }
    .summary { color:var(--muted); max-width:460px; font-size:17px; line-height:1.75; margin:0; }
    .contact-link { display:inline-flex; align-items:center; gap:20px; margin-top:34px; padding:16px 24px; border:1px solid var(--gold); border-radius:3px; color:var(--gold-soft); text-decoration:none; letter-spacing:.2em; text-transform:uppercase; font-size:12px; transition:background .2s ease; }
    .contact-link:hover { background:rgba(231,184,75,.1); }
    footer { border-top:1px solid rgba(231,184,75,.5); padding:22px clamp(22px,6vw,88px); display:flex; align-items:center; justify-content:space-between; gap:16px; color:#aaa49c; font-size:13px; }
    footer a { text-decoration:none; }
    @media (max-width:650px) {
      .topbar { padding-top:20px; padding-bottom:20px; }
      nav { gap:14px; }
      nav a { font-size:10px; letter-spacing:.1em; }
      .hero { min-height:78svh; padding:68px 24px; }
      .hero:before { width:110vw; right:-65%; opacity:.65; }
      .hero:after { bottom:8%; }
      .summary { font-size:15px; }
      footer { flex-direction:column; align-items:flex-start; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="#top" aria-label="XED Brands home"><span class="x">X</span>ED BRANDS</a>
    <nav aria-label="Main navigation">
      <a href="#about">ABOUT</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>
  <main id="top" class="hero">
    <section class="content" id="about">
      <p class="eyebrow">A parent brand for what comes next</p>
      <h1 aria-label="XED"><span class="x">X</span><span class="ed">ED</span></h1>
      <div class="brands">BRANDS</div>
      <p class="tagline">One House. Many Brands.</p>
      <p class="summary">Building a portfolio of distinctive brands and business ventures.</p>
      <a class="contact-link" id="contact" href="mailto:info@xedbrands.com">Get in touch <span aria-hidden="true">→</span></a>
    </section>
  </main>
  <footer>
    <a href="mailto:info@xedbrands.com">info@xedbrands.com</a>
    <span>© 2026 XED Brands. All rights reserved.</span>
  </footer>
</body>
</html>
